name: Process Uploaded Artifacts

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

# One upload at a time so simultaneous pushes don't collide
concurrency:
  group: process-uploads
  cancel-in-progress: false

jobs:
  extract-attachments:
    # Only [UPLOAD] issues, only while still open, only from people with write access
    if: >-
      github.event.issue.state == 'open' &&
      contains(github.event.issue.title, '[UPLOAD]:') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Parse issue fields
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY'
          import os, re

          body = os.environ.get('ISSUE_BODY', '').replace('\r\n', '\n')

          def field(name):
              m = re.search(rf'### {re.escape(name)}\s*\n\n(.*?)(?=\n\n###|\Z)', body, re.DOTALL)
              value = m.group(1).strip() if m else ''
              return '' if value in ('_No response_', 'None') else value

          def first_line(text):
              return text.splitlines()[0].strip() if text else ''

          summary = first_line(field('Summary / Commit Note')) or 'File submission'
          label = first_line(field('Category Label'))
          nums = re.findall(r'#(\d+)', field('Addresses / Closes Issues'))
          fixes = ' '.join(f'fixes #{n}' for n in nums)

          # Single-line values only, so nothing can inject extra outputs
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'summary={summary}\n')
              f.write(f'label={label}\n')
              f.write(f'fixes={fixes}\n')
          PY

      - name: Apply category label
        if: steps.parse.outputs.label != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABEL: ${{ steps.parse.outputs.label }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label "$LABEL" || echo "Could not apply label '$LABEL'"

      - name: Download attachments and commit
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SUMMARY: ${{ steps.parse.outputs.summary }}
          FIXES: ${{ steps.parse.outputs.fixes }}
        run: |
          URLS=$(echo "$ISSUE_BODY" | tr -d '\r' | grep -oE 'https://github.com/user-attachments/files/[^ ")]+' || true)
          if [ -z "$URLS" ]; then
            echo "No attachments found."
            exit 0
          fi

          mkdir -p CAD Excel Documents
          for url in $URLS; do
            filename=$(basename "$url")
            echo "Downloading $filename..."
            # -f: fail on HTTP errors instead of saving an error page as the file
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$url" -o "tmp_$filename"
            case "${filename,,}" in
              *.step|*.stp|*.stl|*.f3d|*.sldprt) mv "tmp_$filename" "CAD/$filename" ;;
              *.xlsx|*.xls|*.csv)                mv "tmp_$filename" "Excel/$filename" ;;
              *)                                 mv "tmp_$filename" "Documents/$filename" ;;
            esac
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CAD Excel Documents

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          # Format: <Summary> (<fixes #X fixes #Y>) [skip ci]
          TITLE="$SUMMARY"
          if [ -n "$FIXES" ]; then
            TITLE="$TITLE ($FIXES)"
          fi
          git commit -m "$TITLE [skip ci]" -m "Uploaded via Issue #${ISSUE_NUMBER}"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Comment and close issue
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Files extracted and committed to the repository automatically."
          gh issue close "$ISSUE_NUMBER"

      - name: Comment when nothing was committed
        if: steps.commit.outputs.committed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body "No new attachments found. Edit this issue to attach the file and I'll try again."
