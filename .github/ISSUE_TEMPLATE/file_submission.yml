name: "File Upload / Resource Submission"
description: "Upload CAD models, Excel spreadsheets, or documentation to the repo"
title: "[UPLOAD]: "
labels: ["file-submission"]
body:
  - type: markdown
    attributes:
      value: "Use this form to submit engineering files (CAD, Excel, PDFs) directly into the repository."

  - type: input
    id: uploader
    attributes:
      label: "Your Name / System Component"
      placeholder: "e.g., Frame CAD, Battery Budget Sheet"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: "Summary / Commit Note"
      description: "Briefly explain what changed or why you are uploading these files."
      placeholder: "e.g., Updated weight estimates for motor mounts and added revised CAD."
    validations:
      required: false

  - type: input
    id: addresses_issues
    attributes:
      label: "Addresses / Closes Issues"
      description: "Enter issue numbers addressed by this upload (e.g., #12, #15)."
      placeholder: "#12, #15"
    validations:
      required: false

  - type: dropdown
    id: custom_label
    attributes:
      label: "Category Label"
      description: "Select a primary subsystem tag."
      options:
        - "cad"
        - "excel"
        - "documentation"
        - "hardware"
    validations:
      required: false

  - type: textarea
    id: attachments
    attributes:
      label: "Attach Files"
      description: "Drag and drop your files here (.step, .stl, .xlsx, .pdf, etc.)"
      placeholder: "Drop files here..."
    validations:
      required: true
